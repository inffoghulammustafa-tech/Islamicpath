    <link rel="preload" href="/audio/bismillah.mp3" as="fetch" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <audio id="tasmiyah-preload-audio" src="/audio/bismillah.mp3" preload="auto" playsinline autoplay></audio>
    <script>
      (function() {
        try {
          var a = document.getElementById('tasmiyah-preload-audio');
          if (a) {
            var p = a.play();
            if (p !== undefined) {
              p.catch(function() {});
            }
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script>
      // Global PWA Prompt listener
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
        console.log('IslamicPath: Global beforeinstallprompt caught!');
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-app-installed'));
        console.log('IslamicPath: App successfully installed to device!');
      });

      // 1. Service Worker Register Karna
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js')
            .then(function (reg) {
              console.log('Service Worker Registered!', reg);
            })
            .catch(function (err) {
              console.log('Service Worker Failed!', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
